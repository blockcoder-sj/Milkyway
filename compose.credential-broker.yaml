name: milkyway-credential-broker

services:
  credential-broker:
    build: .
    restart: unless-stopped
    command: [uvicorn, cloud_app.credential_broker:app, --host, 0.0.0.0, --port, "8010", --workers, "1", --limit-concurrency, "64", --backlog, "64", --timeout-keep-alive, "5"]
    environment:
      APP_ENV: production
      SERVICE_ROLE: broker
      AUTHORITY_ENABLED: "true"
      DATABASE_URL: ${AUTHORITY_DATABASE_URL:?set AUTHORITY_DATABASE_URL}
      SESSION_SECRET: ${AUTHORITY_SESSION_SECRET:?set AUTHORITY_SESSION_SECRET}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      PUBLIC_BASE_URL: https://${BROKER_DOMAIN:?set BROKER_DOMAIN}
      CREDENTIAL_BACKEND: oci-kms
      OCI_KMS_CRYPTO_ENDPOINT: ${OCI_KMS_CRYPTO_ENDPOINT:?set OCI_KMS_CRYPTO_ENDPOINT}
      OCI_AI_CREDENTIAL_KEY_ID: ${OCI_AI_CREDENTIAL_KEY_ID:?set OCI_AI_CREDENTIAL_KEY_ID}
      OCI_MARKET_CREDENTIAL_KEY_ID: ${OCI_MARKET_CREDENTIAL_KEY_ID:?set OCI_MARKET_CREDENTIAL_KEY_ID}
      MEMBER_CREDENTIALS_ENABLED: "true"
      CREDENTIAL_BROKER_APP_TOKEN: ${CREDENTIAL_BROKER_APP_TOKEN:?set CREDENTIAL_BROKER_APP_TOKEN}
      CREDENTIAL_BROKER_PAPER_TOKEN: ${CREDENTIAL_BROKER_PAPER_TOKEN:?set CREDENTIAL_BROKER_PAPER_TOKEN}
      CREDENTIAL_BROKER_BACKTEST_TOKEN: ${CREDENTIAL_BROKER_BACKTEST_TOKEN:?set CREDENTIAL_BROKER_BACKTEST_TOKEN}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      SHARED_AI_ENABLED: "true"
      SHARED_AI_PROVIDER: ${SHARED_AI_PROVIDER:?set SHARED_AI_PROVIDER}
      SHARED_AI_MODEL: ${SHARED_AI_MODEL:?set SHARED_AI_MODEL}
      OCI_SHARED_AI_SECRET_ID: ${OCI_SHARED_AI_SECRET_ID:-}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-false}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://ai:8080/v1}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-Qwen2.5-Coder-7B-Instruct-GGUF}
      LOCAL_AI_API_KEY_FILE: /run/secrets/local_ai_api_key
      QUOTE_PROVIDER: ${QUOTE_PROVIDER:-mock}
      MARKET_DATA_SHARING_ALLOWED: ${MARKET_DATA_SHARING_ALLOWED:-false}
      OCI_BROKER_API_KEY_SECRET_ID: ${OCI_BROKER_API_KEY_SECRET_ID:-}
      OCI_BROKER_API_SECRET_SECRET_ID: ${OCI_BROKER_API_SECRET_SECRET_ID:-}
      BROKER_ACCOUNT_ID: ${BROKER_ACCOUNT_ID:-}
      KIS_ENVIRONMENT: ${KIS_ENVIRONMENT:-paper}
      KIS_QUOTE_TRANSPORT: rest
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-16384}
      MAX_REQUEST_BODY_MESSAGES: ${MAX_REQUEST_BODY_MESSAGES:-64}
      REQUEST_BODY_READ_TIMEOUT_SECONDS: ${REQUEST_BODY_READ_TIMEOUT_SECONDS:-15}
      KMS_MAX_CONCURRENT_REQUESTS: ${KMS_MAX_CONCURRENT_REQUESTS:-4}
      QUOTE_MAX_CONCURRENT_REQUESTS: ${QUOTE_MAX_CONCURRENT_REQUESTS:-8}
      QUOTE_DEADLINE_SECONDS: ${QUOTE_DEADLINE_SECONDS:-20}
      QUOTE_MAX_PROVIDER_CALLS: ${QUOTE_MAX_PROVIDER_CALLS:-125}
      QUOTE_INTERVAL_SECONDS: ${QUOTE_INTERVAL_SECONDS:-10}
      SHARED_QUOTE_BATCH_SIZE: ${SHARED_QUOTE_BATCH_SIZE:-200}
      SHARED_QUOTE_MAX_SYMBOLS_PER_TICK: ${SHARED_QUOTE_MAX_SYMBOLS_PER_TICK:-200}
      SHARED_QUOTE_TICK_DEADLINE_SECONDS: ${SHARED_QUOTE_TICK_DEADLINE_SECONDS:-30}
      QUOTE_MAX_AGE_SECONDS: ${QUOTE_MAX_AGE_SECONDS:-180}
      MAX_USERS: ${MAX_USERS:-40}
      MAX_ACCOUNTS_PER_USER: ${MAX_ACCOUNTS_PER_USER:-3}
      MAX_OUTSTANDING_BACKTESTS_TOTAL: ${MAX_OUTSTANDING_BACKTESTS_TOTAL:-40}
      BACKTEST_TIMEOUT_SECONDS: ${BACKTEST_TIMEOUT_SECONDS:-300}
      MAX_COMPLETED_BACKTESTS_PER_USER: ${MAX_COMPLETED_BACKTESTS_PER_USER:-50}
      BACKTEST_RETENTION_DAYS: ${BACKTEST_RETENTION_DAYS:-30}
      DATASET_DIR: ${DATASET_DIR:-/app/data_cache/backtest_datasets/2026_equities_pit_20260824}
      SNAPSHOTS_GLOB: /app/data_cache/universe_snapshots/*.json
      TERMINAL_EVENTS_PATH: /app/data_cache/universe_events/events.jsonl
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${POSTGRES_TLS_CA_PATH:?set POSTGRES_TLS_CA_PATH}:/run/secrets/postgres_tls_ca:ro
      - ${PROMOTED_DATA_PATH:?set PROMOTED_DATA_PATH to the same approved generation as the app}:/app/data_cache:ro
    secrets:
      - source: local_ai_api_key
        target: local_ai_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks: [proxy, outbound, private-ai]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: "2.0"
    mem_limit: 4g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      credential-broker:
        condition: service_healthy
    environment:
      BROKER_DOMAIN: ${BROKER_DOMAIN:?set BROKER_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./deploy/credential-broker.Caddyfile:/etc/caddy/Caddyfile:ro
      - broker-caddy-data:/data
      - broker-caddy-config:/config
    networks: [frontend, proxy]
    security_opt: [no-new-privileges:true]

  ai:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:991cf50e9eb7dee4c18090849c7f909bafc5a1884cdde2dc3011df7407da09d6
    profiles: [local-ai]
    restart: unless-stopped
    command:
      - --model-url
      - ${LOCAL_AI_MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf?download=true}
      - --alias
      - ${LOCAL_AI_MODEL:-Qwen2.5-Coder-7B-Instruct-GGUF}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key-file
      - /run/secrets/local_ai_api_key
      - --ctx-size
      - "8192"
      - --parallel
      - "2"
      - --cont-batching
    volumes:
      - local-ai-model-cache:/root/.cache
    secrets:
      - local_ai_api_key
    networks: [private-ai, outbound]
    cpus: "4.0"
    mem_limit: 10g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  local-ai-model-cache:
  broker-caddy-data:
  broker-caddy-config:

secrets:
  local_ai_api_key:
    file: ${LOCAL_AI_API_KEY_PATH:?set LOCAL_AI_API_KEY_PATH}

networks:
  frontend:
  proxy:
    internal: true
  private-ai:
    internal: true
  outbound:
