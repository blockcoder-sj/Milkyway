name: Native classroom

on:
  push:
    branches: [codex/week10-python]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install and verify native startup, restart and backup
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            qlab_python=.venv/Scripts/python.exe
          else
            qlab_python=.venv/bin/python
          fi
          "$qlab_python" -m pip install --disable-pip-version-check -r requirements-native.txt
          "$qlab_python" tests/run_classroom_smoke.py
