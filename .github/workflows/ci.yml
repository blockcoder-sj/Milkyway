name: Syntax & Shell Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim-trixie@sha256:1042b61448fef4ba92d16a8c7eb4996d027568ce64792a7877fd88511e0af7c6

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.lock"

      - name: Audit Python dependencies
        run: |
          python -m venv /tmp/milkyway-audit
          /tmp/milkyway-audit/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-audit.lock
          /tmp/milkyway-audit/bin/python -m pip_audit --disable-pip --no-deps --require-hashes -r requirements.lock -f json -o audit.json
          /tmp/milkyway-audit/bin/python -m pip_audit --disable-pip --no-deps --require-hashes -r requirements.lock -f cyclonedx-json -o sbom.cdx.json

      - name: Compile project Python files
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          import sys

          excluded = {".git", ".venv", ".codex", ".agents", "__pycache__", "runtime", "data_cache"}
          files = sorted(path for path in Path(".").rglob("*.py") if not excluded.intersection(path.parts) and not path.is_symlink())

          failed = []
          for path in files:
              try:
                  py_compile.compile(path, doraise=True)
              except Exception as exc:
                  print(f"{path}: {exc}")
                  failed.append(path)

          print(f"Checked {len(files)} Python files")
          if failed:
              sys.exit(1)
          PY

      - name: Check shell syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          excluded = {".git", ".venv", ".codex", ".agents", "runtime", "data_cache"}
          files = sorted(path for path in Path(".").rglob("*.sh") if not excluded.intersection(path.parts) and not path.is_symlink())
          for path in files:
              subprocess.run(["bash", "-n", str(path)], check=True)
          print(f"Checked {len(files)} shell files")
          PY

      - name: Run regression tests
        run: APP_ENV=development python -m unittest discover -s tests -v

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build locked runtime image
        run: docker build --tag milkyway:ci .
      - name: Verify PostgreSQL backup and security boundaries
        run: python3 tests/run_postgres_checks.py --image milkyway:ci
      - name: Verify packaged personal install and crash recovery
        run: python3 tests/run_personal_checks.py --image milkyway:ci --output /tmp/milkyway-personal-checks
      - name: Verify native personal startup and recovery
        run: |
          docker run --rm --network none -e APP_ENV=development -e DATABASE_URL=sqlite:///:memory: milkyway:ci python -m tests.run_native_personal_checks
      - name: Verify frontend behavior in Node
        run: |
          python3 -m unittest discover -s tests -p test_personal_frontend.py -v
          python3 -m unittest discover -s tests -p test_market_frontend.py -v
          python3 -m unittest discover -s tests -p test_market_chart.py -v
          python3 -m unittest discover -s tests -p test_personal_runtime_frontend.py -v
          python3 -m unittest discover -s tests -p test_research_boundaries.py -v
